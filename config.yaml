# =============================================================================
# 🖨️ Fotoprint AI Copilot — Единый файл конфигурации параметров системы
# =============================================================================
# Все динамические настройки: модели нейросетей, лимиты токенов, температура,
# RPM/TPM, параметры балансировщика, роллбэк-системы и векторного поиска.
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# 1. ОБЩИЕ ПАРАМЕТРЫ СРЕДЫ
# -----------------------------------------------------------------------------
environment:
  name: "development"               # development | staging | production
  debug: false
  log_level: "Information"          # Trace | Debug | Information | Warning | Error
  timezone: "Europe/Moscow"

# -----------------------------------------------------------------------------
# 2. ПАРАМЕТРЫ НЕЙРОСЕТИ (LLM & PROXY)
# -----------------------------------------------------------------------------
llm:
  # Активный провайдер: gemini | openai | proxy | anthropic | local | nvidia
  provider: "gemini"

  # Настройки API (Interactions API / OpenAI Compatible)
  proxy:
    enabled: true
    base_url: "https://generativelanguage.googleapis.com/v1beta/interactions"
    api_key_env_var: "GEMINI_API_KEY"
    organization_id: ""

  # Модели для различных задач
  models:
    # Основная модель: gemma-4-31b-it (Gemma 31B, переключено с 550b по запросу)
    chat_model: "gemma-4-31b-it"
    # Быстрая модель для синтеза ответа после инструментов, роутинга и ContextSwitch
    fast_model: "gemini-3.5-flash-lite"
    # Модель для вычисления векторных эмбеддингов регламентов
    embedding_model: "gemini-embedding-2"
    # Резервная модель при недоступности основной (Circuit Breaker и повторы)
    fallback_model: "gemini-3.5-flash-lite"

  # Гиперпараметры генерации ответов нейросетью
  parameters:
    # Температура: 0.1 - 0.3 для строгих регламентов типографии и протоколов
    temperature: 0.2
    # Ограничение вероятностной выборки (nucleus sampling)
    top_p: 0.95
    # Максимальное количество генерируемых токенов в одном ответе
    max_tokens: 4096
    # Штраф за повторение одинаковых фраз
    frequency_penalty: 0.1
    # Штраф за появление новых тем
    presence_penalty: 0.0
    # Таймаут ожидания ответа от нейросети (секунды)
    timeout_seconds: 90

  # Лимиты провайдера нейросети (Rate Limits для защиты от HTTP 429)
  rate_limits:
    # Запросов в минуту (Requests Per Minute, расширенный лимит под автономный вызов инструментов)
    rpm: 40
    # Токенов в минуту (Tokens Per Minute)
    tpm: 1000000
    # Максимальное число параллельных одновременных запросов к LLM
    max_concurrent_requests: 5

# -----------------------------------------------------------------------------
# 3. БАЛАНСИРОВЩИК НАГРУЗКИ И СГЛАЖИВАНИЕ ПИКОВ (LOAD BALANCER & QUEUE)
# -----------------------------------------------------------------------------
load_balancer:
  # Минимальная пауза между последовательными вызовами LLM (мс) для сглаживания всплесков
  min_interval_between_requests_ms: 250
  # Максимальный размер очереди буферизации сообщений при пиках
  queue_capacity: 1000
  # Размер буфера burst для Nginx (сетевой уровень)
  nginx_burst_size: 40
  # Максимальное время нахождения запроса в очереди ожидания до отмены (мс)
  queue_timeout_ms: 60000
  # Включение приоритетной очереди для руководства (C-Level / Director)
  enable_executive_priority: true

# -----------------------------------------------------------------------------
# 4. СИСТЕМА УСТОЙЧИВОСТИ И РОЛЛБЭКА (3 ПОВТОРА + КОМПЕНСАЦИЯ)
# -----------------------------------------------------------------------------
resilience:
  # Количество повторов при сбое узла (строго 3 повтора = 4 попытки всего)
  max_retries: 3
  # Начальная пауза перед первым повтором (мс)
  initial_delay_ms: 200
  # Максимальная задержка между повторами (мс)
  max_delay_ms: 4000
  # Множитель экспоненциального нарастания паузы
  backoff_multiplier: 2.0
  # Добавление случайного разброса (джиттера) для предотвращения резонанса
  enable_jitter: true
  # Автоматический откат состояния транзакции / задачи при сбое всех 3 повторов
  auto_rollback_on_failure: true

  # Предохранитель (Circuit Breaker)
  circuit_breaker:
    enabled: true
    # Число подряд идущих фатальных ошибок для размыкания цепи
    failure_threshold: 5
    # Время нахождения цепи в разомкнутом состоянии (сек) перед пробной попыткой
    recovery_time_seconds: 30

# -----------------------------------------------------------------------------
# 5. ВЕКТОРНЫЙ ПОИСК И RAG (PGVECTOR)
# -----------------------------------------------------------------------------
rag:
  # Размерность векторов эмбеддингов
  embedding_dimensions: 1536
  # Количество релевантных фрагментов регламентов, передаваемых в промпт (Top-K)
  top_k: 5
  # Минимальный порог косинусного сходства (0.0 - 1.0)
  similarity_threshold: 0.70
  # Нарезка документов на фрагменты
  chunking:
    chunk_size: 800
    chunk_overlap: 150
  # Дефолтная группа доступа к корпоративным документам
  default_access_group: "all"

# -----------------------------------------------------------------------------
# 6. ПАРАМЕТРЫ ПРОТОКОЛОВ ПЛАНЕРОК И ПОРУЧЕНИЙ (MOM & TASKS)
# -----------------------------------------------------------------------------
meetings:
  # Окно поиска предстоящих встреч до их начала (минуты)
  pre_meeting_window_minutes: 30
  # Срок исполнения поручения по умолчанию (дней с момента встречи)
  default_deadline_days: 3
  # Требовать обязательное ручное подтверждение (HITL) перед постановкой в Битрикс24
  require_approval_before_bitrix_export: true
  # Формат экспорта протокола встречи по умолчанию: docx | html | pdf
  export_format: "pdf"

# -----------------------------------------------------------------------------
# 7. ТЕЛЕМЕТРИЯ, FINOPS И LANGFUSE (TRACING, TOKENS, EVALUATIONS)
# -----------------------------------------------------------------------------
telemetry:
  enabled: true
  sample_rate: 1.0
  alert_on_security_violations: true
  log_rollback_events: true
  finops:
    # Тарифная сетка Gemini 1.5 Flash (стоимость в $ за 1,000 токенов)
    prompt_token_cost_per_1k: 0.000075
    completion_token_cost_per_1k: 0.000300
    cached_token_cost_per_1k: 0.00001875
  evaluations:
    # Фоновые проверки качества через LLM-as-a-Judge (отключено для dev-режима ради экономии RPM/TPM)
    enable_llm_as_judge: false
    sample_rate: 1.0
    evaluate_faithfulness: true
    evaluate_context_switch_accuracy: true
    evaluate_formatting_and_policy: true


# -----------------------------------------------------------------------------
# 8. ЗАЩИТА ПЕРИМЕТРА И МЕЖСЕРВИСНАЯ БЕЗОПАСНОСТЬ (PERIMETER & ANTI-SCAN)
# -----------------------------------------------------------------------------
security:
  # Запрет прямого доступа к MCP-серверам (все вызовы только через n8n и Gateway)
  enforce_internal_service_auth: true
  # Межсервисный секретный ключ (передается в заголовке X-Internal-Service-Key)
  internal_service_secret_key: "fotoprint-internal-service-secret-token-2026"
  # Защита от поиска открытых портов и сканеров уязвимостей
  anti_port_scan_enabled: true
  # Блокировка известных юзер-агентов сканеров (Nmap, Masscan, Nikto, Sqlmap)
  block_known_scanner_user_agents: true
  # Шаблоны сканируемых путей (ловушки honeypot / probe-paths)
  scanner_probe_path_patterns:
    - ".env"
    - ".git"
    - "wp-"
    - "phpmyadmin"
    - "actuator"
    - "cgi-bin"
    - "setup.cgi"
    - "swagger"
    - "console"
    - "shell"
  # Разрешенные доверенные сети для межсервисного взаимодействия
  allowed_internal_ip_ranges:
    - "127.0.0.1"
    - "::1"
    - "10."
    - "172."
    - "192.168."

# -----------------------------------------------------------------------------
# 9. РЕЖИМ АВТОНОМНОГО АГЕНТА (TOOL CALLING & FUNCTION CALLING)
# -----------------------------------------------------------------------------
agent:
  # Режим: autonomous_tool_calling (нейросеть сама понимает намерение и выбирает MCP)
  mode: "autonomous_tool_calling"
  max_iterations: 3
  system_prompt_language: "ru"

# -----------------------------------------------------------------------------
# 10. ДЕТЕКЦИЯ СМЕНЫ КОНТЕКСТА ЧЕРЕЗ LLM (2-Й ЭТАП ПЕРЕД N8N)
# -----------------------------------------------------------------------------
context_switch:
  # Включение классификации смены контекста нейросетью
  enabled: true
  # Количество последних сообщений сессии для передачи в контекст (до 10 последних сообщений)
  max_history_messages: 10
  # Температура модели для строгой бинарной классификации (0.0 = детерминированно)
  temperature: 0.0
  # Максимальное число токенов для ответа детектора (увеличенный лимит под reasoning-модели)
  max_output_tokens: 1024
  # Автоматическая заморозка (изоляция) предыдущих сообщений в БД при смене темы
  auto_freeze_on_switch: true

# -----------------------------------------------------------------------------
# 11. РАСПОЗНАВАНИЕ РЕЧИ И АУДИОПРОТОКОЛИРОВАНИЕ (SPEECH-TO-TEXT & AUDIO MOM)
# -----------------------------------------------------------------------------
audio:
  enabled: true
  provider: "auto" # "auto" | "local" | "tsukiko" | "gemini"
  vocabulary_path: "config/vocabulary.yaml"
  engine:
    timeout_seconds: 1800
  gemini:
    model: "gemini-2.5-flash"
  max_file_size_mb: 100

# -----------------------------------------------------------------------------
# 12. ПРОАКТИВНЫЕ TELEGRAM-УВЕДОМЛЕНИЯ (РАСПИСАНИЕ И ЗАДАЧИ)
# -----------------------------------------------------------------------------
notifications:
  enabled: true
  digest_hour_msk: 9
  pre_meeting_window_minutes: 30
  task_due_soon_hours: 24
  task_urgent_hours: 2
  save_notifications_to_session: true
  include_empty_morning_digest: true
  task_max_overdue_days: 30
  max_task_alerts_per_run_per_employee: 5

# -----------------------------------------------------------------------------
# 13. MCP-СЕРВИСЫ И МИКРОСЕРВИСНЫЕ URL (MCP URLS)
# -----------------------------------------------------------------------------
mcp_urls:
  employee_reader: "http://mcp-employee-reader:8081"
  one_c: "http://mcp-1c:8082"
  bitrix24: "http://mcp-bitrix24:8083"
  calendar: "http://mcp-calendar:8084"

# -----------------------------------------------------------------------------
# 14. ИНТЕГРАЦИЯ КАЛЕНДАРЯ (CALENDAR CONFIG)
# -----------------------------------------------------------------------------
calendar:
  enabled: true
  service_url: "http://mcp-calendar:8084"
  timezone: "Europe/Moscow"
  working_hours_start: "09:00"
  working_hours_end: "18:00"
  default_buffer_minutes: 10
  default_slot_duration_minutes: 30



