user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off; # Скрытие версии веб-сервера от сканеров
    client_max_body_size 100M; # Разрешить загрузку аудиозаписей совещаний до 100 МБ

    # =========================================================================
    # ЗАЩИТА ОТ СКАНЕРОВ ПОРТОВ И УЯЗВИМОСТЕЙ (ANTI-SCANNER MAP)
    # =========================================================================
    map $http_user_agent $is_scanner_bot {
        default 0;
        ~*(nmap|masscan|nikto|sqlmap|zgrab|shodan|censys|gobuster|dirbuster|wprecon) 1;
    }

    # =========================================================================
    # RATE LIMITING ZONES & СГЛАЖИВАНИЕ ПИКОВЫХ НАГРУЗОК
    # =========================================================================
    # Зона для вебхуков Telegram (сглаживание пачек сообщений)
    limit_req_zone $binary_remote_addr zone=telegram_webhook_zone:10m rate=50r/s;

    # Зона для общего API шлюза
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=30r/s;

    # Зона для n8n вебхуков
    limit_req_zone $binary_remote_addr zone=n8n_zone:10m rate=50r/s;

    # =========================================================================
    # ДИНАМИЧЕСКИЙ DNS DOCKER (ПРЕДОТВРАЩЕНИЕ 502 ПРИ ПЕРЕСБОРКЕ КОНТЕЙНЕРОВ)
    # =========================================================================
    # Статические upstream-блоки в open-source Nginx кешируют IP контейнеров до
    # рестарта. Используем внутренний DNS Docker (127.0.0.11) + переменные в
    # proxy_pass, чтобы пересоздание ai-gateway/n8n не ломало маршрутизацию.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 1. Мгновенный сброс соединения (444) для известных сканеров портов
        if ($is_scanner_bot) {
            return 444;
        }

        # 2. Ловушки honeypot: блокировка поиска закрытых файлов (.env, .git, wp-, phpmyadmin, actuator и т.д.)
        location ~* (\.env|\.git|wp-|phpmyadmin|actuator|cgi-bin|setup\.cgi|swagger|console|shell) {
            access_log /var/log/nginx/security_attacks.log;
            return 444;
        }

        # 3. Полный запрет прямого внешнего обращения к путям MCP инструментов (включая knowledge-base, calendar/meeting RAG и прямые имена инструментов)
        location ~* ^/(tools|mcp|employee-reader|1c|bitrix24|calendar|knowledge-base|knowledgebase|search_typography_regulations|search_meeting_rag|index_corporate_document) {
            access_log /var/log/nginx/security_attacks.log;
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Прямой доступ к MCP-серверам из публичной сети запрещен. Используйте авторизованную точку входа."}';
        }

        location ~* ^/api/(tools|mcp) {
            access_log /var/log/nginx/security_attacks.log;
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Прямой доступ к MCP-инструментам через внешний шлюз запрещен."}';
        }

        # 3b. Запрет прямого внешнего обращения к внутренним служебным маршрутам Gateway (доступны только для n8n внутри fotoprint-net)
        location ~* ^/api/(llm|gemini|context|telemetry|notifications|chat/ingress|telegram/set-webhook|meetings/save-and-index|rag/reindex-embeddings) {
            access_log /var/log/nginx/security_attacks.log;
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Внутренний служебный маршрут шлюза закрыт для публичной сети."}';
        }

        # 4. Проверка работоспособности самого Nginx
        location /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-load-balancer"}';
        }

        # ---------------------------------------------------------------------
        # 5. Telegram Webhook: Сглаживание пиков с очередью burst=200 (пропускает 40+ чел/мин без потерь)
        # ---------------------------------------------------------------------
        location /api/telegram/webhook {
            limit_req zone=telegram_webhook_zone burst=200 delay=50;
            limit_req_status 429;

            set $ai_gateway_upstream "http://ai-gateway:8080";
            proxy_pass $ai_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Очищаем внутренние служебные заголовки, чтобы внешний клиент не мог их подделать
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-User-Confirmed "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 6. Общий REST API шлюза (RAG, встречи, экспорт протоколов, веб-чат)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_zone burst=150 nodelay;
            limit_req_status 429;

            set $ai_gateway_upstream "http://ai-gateway:8080";
            proxy_pass $ai_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Очищаем внутренние служебные заголовки, чтобы внешний клиент не мог их подделать
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-User-Confirmed "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 110M;
        }

        # Health endpoint шлюза
        location /health {
            set $ai_gateway_upstream "http://ai-gateway:8080";
            proxy_pass $ai_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # 7. Вебхуки оркестратора n8n
        # ---------------------------------------------------------------------
        location /webhook/ {
            limit_req zone=n8n_zone burst=30 delay=5;

            set $n8n_upstream "http://n8n:5678";
            proxy_pass $n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Очищаем внутренние служебные заголовки, чтобы внешний клиент не мог их подделать
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-User-Confirmed "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ---------------------------------------------------------------------
        # 8. Track 1 Management Dashboard (PicPac Pulse)
        # ---------------------------------------------------------------------
        location = /dashboard {
            return 302 /dashboard/$is_args$args;
        }

        location /dashboard/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /dashboard/index.html;
        }

        # ---------------------------------------------------------------------
        # 9. Web Chat UI (Fotoprint Copilot + NVIDIA Nemotron)
        # ---------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
